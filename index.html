<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cardápio - Domo</title>

    <!-- Ícone do site -->
    <link rel="icon" href="icon/Logo Domo Quadrado 48 x 48.png" type="image/x-icon">

    <!-- Tags para pré-visualização em redes sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cardapio.domoarkitekturo.org/" />
    <meta property="og:title" content="Cardápio - Domo Café & Arquitetura" />
    <meta property="og:description" content="Consulte o nosso cardápio digital e conheça as nossas opções." />

    <!-- Imagem para pré-visualização -->
    <meta property="og:image" content="https://cardapio.domoarkitekturo.org/cardapio_webp/1.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <!-- Vercel Web Analytics -->
    <script defer src="/_vercel/insights/script.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            background-color: #eddbbf;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: manipulation;
        }

        .swiper {
            width: 100%;
            height: 100%;
        }

        .swiper-slide {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        /* Container obrigatório do Swiper para suportar zoom por pinça e duplo toque */
        .swiper-zoom-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .swiper-slide img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            border-radius: 4px;
        }

        /* Paginação no rodapé */
        .swiper-pagination-bullet {
            background: #ffffff;
            opacity: 0.5;
        }

        .swiper-pagination-bullet-active {
            background: #c5a059;
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="swiper">
        <div class="swiper-wrapper">
            <!-- Cada imagem envolvida pelo swiper-zoom-container -->
            <div class="swiper-slide">
                <div class="swiper-zoom-container"><img src="cardapio_webp/1.webp" alt="Página 1" /></div>
            </div>
            <div class="swiper-slide">
                <div class="swiper-zoom-container"><img src="cardapio_webp/2.webp" alt="Página 2" /></div>
            </div>
            <div class="swiper-slide">
                <div class="swiper-zoom-container"><img src="cardapio_webp/3.webp" alt="Página 3" /></div>
            </div>
            <div class="swiper-slide">
                <div class="swiper-zoom-container"><img src="cardapio_webp/4.webp" alt="Página 4" /></div>
            </div>
            <div class="swiper-slide">
                <div class="swiper-zoom-container"><img src="cardapio_webp/5.webp" alt="Página 5" /></div>
            </div>
            <div class="swiper-slide">
                <div class="swiper-zoom-container"><img src="cardapio_webp/6.webp" alt="Página 6" /></div>
            </div>
            <div class="swiper-slide">
                <div class="swiper-zoom-container"><img src="cardapio_webp/7.webp" alt="Página 7" /></div>
            </div>
            <div class="swiper-slide">
                <div class="swiper-zoom-container"><img src="cardapio_webp/8.webp" alt="Página 8" /></div>
            </div>
            <div class="swiper-slide">
                <div class="swiper-zoom-container"><img src="cardapio_webp/9.webp" alt="Página 9" /></div>
            </div>
            <div class="swiper-slide">
                <div class="swiper-zoom-container"><img src="cardapio_webp/10.webp" alt="Página 10" /></div>
            </div>
            <div class="swiper-slide">
                <div class="swiper-zoom-container"><img src="cardapio_webp/11.webp" alt="Página 11" /></div>
            </div>
            <div class="swiper-slide">
                <div class="swiper-zoom-container"><img src="cardapio_webp/12.webp" alt="Página 12" /></div>
            </div>
        </div>

        <div class="swiper-pagination"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper('.swiper', {
            direction: 'horizontal',
            loop: false,
            speed: 350,
            grabCursor: true,
            // Habilita o gesto de pinça e duplo toque
            zoom: {
                maxRatio: 1.5,
                minRatio: 1,
            },
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
            keyboard: {
                enabled: true,
            },
        });
    </script>
</body>

</html>
